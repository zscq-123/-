name: verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: pip install -r apps/api/requirements.txt
      - run: python -m pytest -q
        working-directory: apps/api
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: API integration and synthetic regression
        env:
          RATE_LIMIT_PER_MINUTE: '10000'
          DATABASE_URL: sqlite:////tmp/legal-aid-ci.db
          DEMO_PASSWORD: ci-only-demo-password
          MODEL_MODE: deterministic
        run: |
          (cd apps/api && uvicorn app.main:app --host 127.0.0.1 --port 8000) > /tmp/legal-aid-api.log 2>&1 &
          service_pid=$!
          trap 'kill "$service_pid" 2>/dev/null || true' EXIT
          python scripts/api_smoke.py --wait
          python scripts/api_boundaries.py
          python scripts/evaluate.py --output artifacts/local/evaluation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-evaluation
          path: artifacts/local/evaluation.json
          if-no-files-found: ignore
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run typecheck
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
